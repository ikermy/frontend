services:
  # Nuxt static frontend served by nginx.
  # В проде HTTPS терминирует Envoy (bff) с Let's Encrypt, фронт остаётся на HTTP (80)
  # внутри docker-сети barcode_shared. Envoy рутит /* → frontend:80 и /api/v1 → bff:8080.
  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE:-ikermy/frontend}:${TAG:-latest}
    container_name: frontend
    restart: unless-stopped
    networks:
      - barcode_shared

networks:
  # Must already exist on the VPS (created by the base barcode system compose)
  barcode_shared:
    external: true
