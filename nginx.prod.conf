# nginx — фронтенд (статический Nuxt build) для PROD-режима.
# HTTPS терминирует Envoy (bff) с Let's Encrypt сертификатами; фронт остаётся
# на HTTP внутри docker-сети barcode_shared. Проксирует /api/v1 → bff:8080.
#
# Внутри docker-сети barcode_shared:
#   /api/v1/*  → bff:8080
#   /*         → статика (SPA)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/ {
        proxy_pass http://bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
