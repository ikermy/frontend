name: Deploy Front Production
on:
  push:
    branches:
      - master
      - main
      - production
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Compose file that is copied to the server
  COMPOSE_FILE: docker-compose.prod.yml
  # Absolute path where the project lives on the server (container + .env live here)
  DEPLOY_DIR: /barcode/front

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate required variables
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          echo "DOMAIN=$DOMAIN"
          test -n "$DOMAIN" || {
            echo "DOMAIN repository variable is not configured"
            exit 1
          }

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            NUXT_PUBLIC_API_BASE_URL=${{ secrets.NUXT_PUBLIC_API_BASE_URL }}
            NUXT_PUBLIC_API_MODE=${{ secrets.NUXT_PUBLIC_API_MODE }}
            NUXT_PUBLIC_TELEGRAM_BOT_USERNAME=${{ secrets.NUXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
            NUXT_PUBLIC_TELEGRAM_AUTH_URL=${{ secrets.NUXT_PUBLIC_TELEGRAM_AUTH_URL }}
            NGINX_TLS=prod
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "${{ env.COMPOSE_FILE }}"
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE: ${{ env.IMAGE_NAME }}
          SHA: ${{ github.sha }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          DOMAIN: ${{ secrets.DOMAIN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUXT_PUBLIC_API_BASE_URL: ${{ secrets.NUXT_PUBLIC_API_BASE_URL }}
          NUXT_PUBLIC_API_MODE: ${{ secrets.NUXT_PUBLIC_API_MODE }}
          NUXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ secrets.NUXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
          NUXT_PUBLIC_TELEGRAM_AUTH_URL: ${{ secrets.NUXT_PUBLIC_TELEGRAM_AUTH_URL }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: REGISTRY,IMAGE,SHA,COMPOSE_FILE,DEPLOY_DIR,DOMAIN,GHCR_USER,GHCR_TOKEN,NUXT_PUBLIC_API_BASE_URL,NUXT_PUBLIC_API_MODE,NUXT_PUBLIC_TELEGRAM_BOT_USERNAME,NUXT_PUBLIC_TELEGRAM_AUTH_URL
          script: |
            set -e
            cd $DEPLOY_DIR

            # Write the real .env (all runtime variables for the container)
            cat > .env <<EOF
            REGISTRY=$REGISTRY
            IMAGE=$IMAGE
            TAG=prod
            DOMAIN=$DOMAIN
            NUXT_PUBLIC_API_BASE_URL=$NUXT_PUBLIC_API_BASE_URL
            NUXT_PUBLIC_API_MODE=$NUXT_PUBLIC_API_MODE
            NUXT_PUBLIC_TELEGRAM_BOT_USERNAME=$NUXT_PUBLIC_TELEGRAM_BOT_USERNAME
            NUXT_PUBLIC_TELEGRAM_AUTH_URL=$NUXT_PUBLIC_TELEGRAM_AUTH_URL
            EOF

            # GHCR requires authentication for pulls, even for the same repo.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Deploy application
            docker compose -f $COMPOSE_FILE pull
            docker compose -f $COMPOSE_FILE up -d
            # Cleanup
            docker image prune -f
