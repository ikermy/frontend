name: CD Frontend

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NGINX_TLS=prod
            NUXT_PUBLIC_API_BASE_URL=${{ vars.NUXT_PUBLIC_API_BASE_URL }}
            NUXT_PUBLIC_API_MODE=${{ vars.NUXT_PUBLIC_API_MODE }}
            NUXT_PUBLIC_TELEGRAM_BOT_USERNAME=${{ vars.NUXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
            NUXT_PUBLIC_TELEGRAM_AUTH_URL=${{ vars.NUXT_PUBLIC_TELEGRAM_AUTH_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend:latest
            ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}
