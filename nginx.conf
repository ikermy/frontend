# nginx — фронтенд (статический Nuxt build) для DEV-режима.
# Терминирует TLS сам (443) на порту 80/443, используя локальные dev-сертификаты,
# и проксирует /api/v1 → bff:8080.
#
# ВАЖНО: эти сертификаты (bff/envoy/certs/host.pem) ТОЛЬКО для локальной разработки.
# В проде HTTPS терминирует Envoy (bff) с сертификатами Let's Encrypt, а фронт
# остаётся на HTTP внутри docker-сети (см. nginx.prod.conf).
#
# Внутри docker-сети barcode_shared:
#   /api/v1/*  → bff:8080
#   /*         → статика (SPA)

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/host.pem;
    ssl_certificate_key /etc/nginx/certs/host-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/ {
        proxy_pass http://bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
